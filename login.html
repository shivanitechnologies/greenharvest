<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer & Admin Sign In | GreenHarvest</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <meta name="description" content="Sign in to your GreenHarvest account to manage fresh organic orders, delivery addresses, and Harvest Club benefits.">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            forest: '#315C3B',
            gold: '#D6A85F',
            cream: { DEFAULT: '#FBF9F5', surface: '#F4EFEA', card: '#FFFFFF' },
            charcoal: { DEFAULT: '#121614', surface: '#1A211D', card: '#222B25', border: '#2F3B33' }
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#FBF9F5] dark:bg-[#121614] text-[#1A3320] dark:text-[#F3F4F6] font-body min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md my-8">
    
    <!-- Brand Logo Top Link -->
    <div class="text-center mb-6">
      <a href="index.html" class="inline-flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-[#315C3B] flex items-center justify-center text-white shadow-md">
          <svg class="w-7 h-7 text-[#D6A85F]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </div>
        <div class="text-left">
          <span class="font-heading font-bold text-2xl text-[#315C3B] dark:text-white leading-none block">GreenHarvest</span>
          <span class="text-[10px] font-medium text-[#D6A85F] uppercase tracking-widest">Fresh • Organic • Healthy</span>
        </div>
      </a>
    </div>

    <!-- Login Card (No navbar, no footer per specification) -->
    <div class="bg-white dark:bg-[#222B25] p-8 sm:p-10 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-xl space-y-6">
      <div>
        <h1 class="font-heading font-bold text-2xl text-gray-900 dark:text-white">Welcome Back</h1>
        <p class="text-xs text-gray-500 mt-1">Sign in to manage your organic grocery deliveries.</p>
      </div>

      <!-- Quick Demo Credentials Selector -->
      <div class="p-3 bg-[#F4EFEA] dark:bg-[#1A211D] rounded-xl text-xs space-y-1.5 border border-gray-200/80 dark:border-gray-800">
        <span class="font-bold text-[#315C3B] dark:text-[#D6A85F] block">Quick Demo Logins:</span>
        <div class="flex flex-wrap gap-2">
          <button type="button" onclick="fillDemo('admin')" class="px-2.5 py-1 rounded bg-white dark:bg-gray-800 border text-[11px] font-medium hover:border-[#315C3B]">
            Admin Demo
          </button>
          <button type="button" onclick="fillDemo('customer')" class="px-2.5 py-1 rounded bg-white dark:bg-gray-800 border text-[11px] font-medium hover:border-[#315C3B]">
            Customer Demo
          </button>
        </div>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div>
          <label for="login-email" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Email or Phone Number *</label>
          <input 
            id="login-email" 
            type="email" 
            required 
            placeholder="user@example.com" 
            class="w-full px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-[#1A211D] text-sm text-gray-900 dark:text-white focus:outline-none focus:border-[#315C3B]"
          >
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="login-password" class="text-xs font-semibold text-gray-700 dark:text-gray-300">Password *</label>
            <a href="forgot-password.html" class="text-[11px] text-[#315C3B] dark:text-[#D6A85F] hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <input 
              id="login-password" 
              type="password" 
              required 
              placeholder="••••••••" 
              class="w-full px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-[#1A211D] text-sm text-gray-900 dark:text-white focus:outline-none focus:border-[#315C3B]"
            >
            <button 
              type="button" 
              onclick="togglePasswordVisibility('login-password', this)" 
              class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
              aria-label="Toggle password visibility"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="login-remember" checked class="accent-[#315C3B] rounded">
            <span class="text-gray-600 dark:text-gray-400">Remember Me</span>
          </label>
        </div>

        <button type="submit" class="btn-primary w-full text-sm font-semibold !min-h-[46px] justify-center">
          Sign In
        </button>

        <!-- Google OAuth demo button -->
        <div class="pt-2">
          <button 
            type="button" 
            onclick="showToast('Google Sign-in demo activated', 'info')" 
            class="w-full py-2.5 px-4 rounded-xl border border-gray-300 dark:border-gray-700 text-xs font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 flex items-center justify-center gap-2.5 transition-colors"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Sign in with Google
          </button>
        </div>
      </form>

      <div class="text-center text-xs text-gray-500 pt-2 border-t border-gray-100 dark:border-gray-800">
        Don't have an account yet? 
        <a href="register.html" class="font-bold text-[#315C3B] dark:text-[#D6A85F] hover:underline">Create Account</a>
      </div>
    </div>

    <!-- Quick Home return -->
    <div class="text-center mt-6 text-xs text-gray-400">
      <a href="index.html" class="hover:underline">←  Return to GreenHarvest Home</a>
    </div>

  </div>

  <div id="toast-container"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function fillDemo(type) {
      const emailInput = document.getElementById("login-email");
      const passInput = document.getElementById("login-password");
      if (type === "admin") {
        emailInput.value = "admin@greenharvest.com";
        passInput.value = "admin123";
        showToast("Filled demo admin credentials.");
      } else {
        emailInput.value = "user@example.com";
        passInput.value = "password123";
        showToast("Filled demo customer credentials.");
      }
    }
  </script>
</body>
</html>
